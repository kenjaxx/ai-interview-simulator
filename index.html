<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>AI Interview Coach – practice out loud, get real feedback</title>
    <meta
      name="description"
      content="A voice-driven mock interview. Answer out loud or type, and get scored on content, clarity and confidence, with STAR checks, follow-up questions and sample answers."
    />
    <meta name="theme-color" content="#0d0e13" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#f6f5fa" media="(prefers-color-scheme: light)" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="AI Interview Coach" />
    <meta
      property="og:description"
      content="Practice interviews out loud and get scored on content, clarity and confidence."
    />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="AI Interview Coach" />
    <meta
      name="twitter:description"
      content="Practice interviews out loud and get scored on content, clarity and confidence."
    />

    <script>
      // Sets the theme before first paint so there's no dark/light flash.
      (function () {
        var root = document.documentElement;
        try {
          var t = localStorage.getItem("interview-ai-theme");
          if (t !== "light" && t !== "dark") {
            t = window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
          }
          root.setAttribute("data-theme", t);
        } catch (e) {
          root.setAttribute("data-theme", "dark");
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
